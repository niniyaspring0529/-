<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat with Eiji</title>
    <style>
        :root {
            --bg-color: #f7f7f7;
            --user-bubble: #f6a4b4;
            --char-bubble: #ffffff;
            --text-main: #333333;
            --text-sub: #999999;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
        }

        .phone-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fffafa;
            position: relative;
        }

        /* 頂部通話列 */
        .top-call-bar {
            background: #1a1a1a;
            color: white;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 30px;
            margin: 10px;
            font-size: 0.85rem;
            z-index: 10;
        }
        .avatar-mini { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

        /* 字卡管理區 */
        .card-manager {
            padding: 10px;
            background: #fff;
            border-bottom: 1px solid #eee;
            max-height: 120px;
            overflow-y: auto;
        }
        .word-tag {
            display: inline-flex;
            align-items: center;
            background: #fff0f3;
            border: 1px solid #ffb6c1;
            padding: 4px 10px;
            margin: 3px;
            border-radius: 15px;
            font-size: 0.75rem;
            color: #ff8fa3;
        }
        .del-card { margin-left: 5px; cursor: pointer; color: #ff4d6d; border: none; background: none; }

        /* 聊天區域 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .chat-area::-webkit-scrollbar { display: none; }

        .msg-group { display: flex; gap: 10px; max-width: 85%; }
        .msg-group.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-group.char { align-self: flex-start; }

        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .msg-content { display: flex; flex-direction: column; gap: 4px; }
        .me .msg-content { align-items: flex-end; }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 1rem;
            line-height: 1.5;
            position: relative;
        }
        .me .msg-bubble { background: var(--user-bubble); color: white; border-top-right-radius: 5px; }
        .char .msg-bubble { background: var(--char-bubble); color: var(--text-main); border-top-left-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        .time-stamp { font-size: 0.7rem; color: var(--text-sub); }

        /* 輸入欄位 */
        .bottom-bar {
            padding: 10px 15px 30px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-box {
            flex: 1;
            background: #f0f0f0;
            border: none;
            padding: 12px 18px;
            border-radius: 25px;
            outline: none;
        }
        .send-btn { background: #ffb6c1; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- 頂部通話列（參考截圖設計） -->
    <div class="top-call-bar">
        <img src="https://i.imgur.com/G4h1mYl.png" class="avatar-mini">
        <span>菊丸 英二 31:24</span>
        <span style="color: #ff4d4d; margin-left: 10px;">📞</span>
    </div>

    <!-- 字卡庫 -->
    <div class="card-manager">
        <div id="cardsContainer"></div>
        <div style="margin-top: 8px; display: flex; gap: 5px;">
            <input type="text" id="newCardInput" placeholder="新增回覆..." style="flex:1; font-size: 0.7rem; padding: 5px;">
            <button onclick="saveNewCard()" style="font-size: 0.7rem;">新增</button>
        </div>
    </div>

    <!-- 對話內容 -->
    <div class="chat-area" id="chatArea"></div>

    <!-- 輸入區 -->
    <div class="bottom-bar">
        <input type="text" id="userInput" class="input-box" placeholder="發送訊息...">
        <button onclick="handleUserSend()" class="send-btn">➔</button>
    </div>
</div>

<script>
    // 儲存金鑰
    const STORAGE_KEY_MSGS = 'eiji_chat_history';
    const STORAGE_KEY_CARDS = 'eiji_word_cards';

    // 大頭貼網址 (可替換成你喜歡的圖片路徑)
    const USER_AVATAR = "https://i.imgur.com/yvX39u4.png"; // 日向鈴音
    const CHAR_AVATAR = "https://i.imgur.com/G4h1mYl.png"; // 菊丸英二

    let wordCards = JSON.parse(localStorage.getItem(STORAGE_KEY_CARDS)) || ["今天也要加油喔！", "笨蛋，不准太累！", "想我了嗎？", "🎾 嘿嘿，贏了！"];
    let chatHistory = JSON.parse(localStorage.getItem(STORAGE_KEY_MSGS)) || [];

    window.onload = () => {
        renderCards();
        renderChat();
        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleUserSend(); });
    };

    function renderCards() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = wordCards.map((text, i) => `
            <div class="word-tag">
                ${text} <button class="del-card" onclick="deleteCard(${i})">✕</button>
            </div>
        `).join('');
        localStorage.setItem(STORAGE_KEY_CARDS, JSON.stringify(wordCards));
    }

    function saveNewCard() {
        const val = document.getElementById('newCardInput').value.trim();
        if(val) { wordCards.push(val); document.getElementById('newCardInput').value = ''; renderCards(); }
    }

    function deleteCard(index) {
        wordCards.splice(index, 1);
        renderCards();
    }

    function handleUserSend() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        addMessage('me', '日向 鈴音', text);
        input.value = '';

        // 模擬大寶回覆
        setTimeout(() => {
            if(wordCards.length > 0) {
                const randomText = wordCards[Math.floor(Math.random() * wordCards.length)];
                addMessage('char', '菊丸 英二', randomText);
            }
        }, 1200);
    }

    function addMessage(sender, name, text) {
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const msg = { sender, name, text, time };
        chatHistory.push(msg);
        localStorage.setItem(STORAGE_KEY_MSGS, JSON.stringify(chatHistory));
        renderChat();
    }

    function renderChat() {
        const area = document.getElementById('chatArea');
        area.innerHTML = chatHistory.map(m => `
            <div class="msg-group ${m.sender}">
                <img src="${m.sender === 'me' ? USER_AVATAR : CHAR_AVATAR}" class="avatar">
                <div class="msg-content">
                    <div style="font-size: 0.7rem; color: #999;">${m.name}</div>
                    <div class="msg-bubble">${m.text}</div>
                    <div class="time-stamp">${m.time}</div>
                </div>
            </div>
        `).join('');
        area.scrollTop = area.scrollHeight;
    }
</script>

</body>
</html>
