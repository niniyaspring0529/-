<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Space</title>
    <style>
        :root {
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --primary: #ffb6c1;
            --primary-dark: #ff8fa3;
            --text-color: #4a4a4a;
            --user-msg-bg: #ffe4e8;
            --char-msg-bg: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 20px);
        }

        .calendar-header {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* 狀態與電話區 */
        .status-section {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ffe4e8;
            flex-shrink: 0;
        }

        .mood-badge {
            display: inline-block;
            background: #ffe4e8;
            color: #ff4d6d;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* 字卡管理（這區現在純粹作為大寶的「台詞庫」） */
        .word-cards-container {
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            background: #fffafb;
            border-bottom: 1px dashed #ffe4e8;
        }
        .word-cards-container::-webkit-scrollbar { display: none; }

        .word-card {
            display: inline-block;
            background: white;
            border: 1px solid var(--primary);
            padding: 5px 30px 5px 10px;
            margin: 4px;
            border-radius: 15px;
            position: relative;
            font-size: 0.8rem;
        }

        .delete-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff4d6d;
            border: none;
            background: none;
            font-weight: bold;
            cursor: pointer;
        }

        /* 聊天室核心 */
        .chat-section {
            padding: 10px;
            background: #fdf2f4;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-display {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-display::-webkit-scrollbar { display: none; }

        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.3s ease; }
        .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.character { align-self: flex-start; align-items: flex-start; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .me .msg-bubble { background: var(--user-msg-bg); border-bottom-right-radius: 4px; border: 1px solid #ffd0d6; }
        .character .msg-bubble { background: var(--char-msg-bg); border-bottom-left-radius: 4px; border: 1px solid #ebd0d4; }

        /* 打字輸入區 */
        .chat-input-area {
            background: white;
            padding: 12px;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }
        .input-row { display: flex; gap: 8px; }

        input[type="text"] {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 10px 15px;
            outline: none;
            font-size: 0.95rem;
        }

        /* 拖曳電話 */
        #callUI {
            display: none;
            position: fixed;
            bottom: 150px;
            right: 20px;
            width: 130px;
            background: rgba(51, 51, 51, 0.9);
            color: white;
            border-radius: 15px;
            z-index: 9999;
            text-align: center;
            user-select: none;
        }
        #callUI.mini { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; }
        .call-drag-handle { padding: 5px; cursor: move; background: rgba(255,255,255,0.1); border-radius: 15px 15px 0 0; font-size: 0.7rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="calendar-header" id="dateDisplay">2026.05.26</div>
        
        <div class="status-section">
            <div class="mood-badge" id="currentMood">🎾 練習中</div>
            <button class="btn-primary" style="border:none; border-radius:15px; padding:8px; width:100%; font-weight:bold;" onclick="tryCall()">撥打電話給大寶 📞</button>
        </div>

        <!-- 台詞庫：在這裡新增字卡，大寶會從這裡隨機挑話回你 -->
        <div class="word-cards-container" id="cardsList"></div>
        <div style="display:flex; padding:5px 10px; gap:5px; background:#fff;">
            <input type="text" id="wordInput" style="font-size:0.8rem; padding:5px;" placeholder="新增大寶的自動回覆...">
            <button onclick="addCard()" style="background:var(--primary); color:white; border:none; border-radius:5px; padding:0 10px;">+</button>
        </div>

        <div class="chat-section">
            <div class="chat-display" id="chatDisplay"></div>
        </div>

        <div class="chat-input-area">
            <div class="input-row">
                <input type="text" id="userMsgInput" placeholder="傳訊息給大寶...">
                <button onclick="sendUserMessage()" style="background:var(--primary); color:white; border:none; border-radius:20px; padding:0 15px; font-weight:bold;">發送</button>
            </div>
        </div>
    </div>

    <!-- 電話懸浮 -->
    <div id="callUI">
        <div class="call-drag-handle" id="callDragHandle">⋮⋮ 拖曳 <span onclick="toggleMini(event)" style="float:right; padding:0 5px;">−</span></div>
        <div id="callBody" style="padding:10px;">
            <div style="font-size:0.8rem;">大寶通話中</div>
            <div id="timer" style="font-family:monospace; margin:5px 0;">00:00</div>
            <button onclick="hangUp()" style="background:#ff4d4d; color:white; border:none; border-radius:10px; font-size:0.7rem; padding:3px 8px;">掛斷</button>
        </div>
    </div>

    <script>
        const initPhrases = ["今天也要加油喔！", "笨蛋，不准太累！", "想我了嗎？", "專題做完了嗎？", "🎾 嘿嘿，贏了！"];
        
        window.onload = () => {
            const now = new Date();
            document.getElementById('dateDisplay').innerText = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()}`;
            initPhrases.forEach(p => createCardElement(p));
            makeElementDraggable(document.getElementById("callUI"));
            
            // 進入畫面先打個招呼
            setTimeout(() => appendMessage('character', '大寶', '唷！你來啦？'), 500);
        };

        function addCard() {
            const input = document.getElementById('wordInput');
            if (input.value.trim()) { createCardElement(input.value); input.value = ''; }
        }

        function createCardElement(text) {
            const container = document.getElementById('cardsList');
            const div = document.createElement('div');
            div.className = 'word-card';
            div.innerHTML = `<span>${text}</span><button class="delete-btn" onclick="this.parentElement.remove()">✕</button>`;
            container.prepend(div);
        }

        // 我方發送訊息
        function sendUserMessage() {
            const input = document.getElementById('userMsgInput');
            const text = input.value.trim();
            if (text) {
                appendMessage('me', '我', text);
                input.value = '';
                // 觸發大寶的自動回覆
                triggerCharacterReply();
            }
        }

        // 大寶自動隨機回覆邏輯
        function triggerCharacterReply() {
            // 隨機延遲 1~2 秒，模擬打字
            const delay = Math.random() * 1000 + 1000;
            
            setTimeout(() => {
                const cards = document.querySelectorAll('.word-card span');
                if (cards.length > 0) {
                    // 從台詞庫中隨機選一句
                    const randomIndex = Math.floor(Math.random() * cards.length);
                    const replyText = cards[randomIndex].innerText;
                    appendMessage('character', '大寶', replyText);
                }
            }, delay);
        }

        function appendMessage(sender, name, content) {
            const display = document.getElementById('chatDisplay');
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${sender}`;
            wrapper.innerHTML = `<div style="font-size:0.7rem; color:#888; margin-bottom:2px;">${name}</div><div class="msg-bubble">${content}</div>`;
            display.appendChild(wrapper);
            display.scrollTop = display.scrollHeight;
        }

        // 電話功能與拖曳 (略同前版，已優化)
        let timerInt, sec = 0, isMini = false;
        function tryCall() { document.getElementById('callUI').style.display = 'block'; startTimer(); }
        function startTimer() { 
            sec = 0; clearInterval(timerInt);
            timerInt = setInterval(() => {
                sec++;
                let m = Math.floor(sec/60).toString().padStart(2, '0');
                let s = (sec%60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }
        function hangUp() { document.getElementById('callUI').style.display = 'none'; clearInterval(timerInt); }
        function toggleMini(e) { 
            e.stopPropagation(); isMini = !isMini;
            const ui = document.getElementById('callUI');
            ui.classList.toggle('mini', isMini);
            document.getElementById('callBody').style.display = isMini ? 'none' : 'block';
        }

        function makeElementDraggable(elmnt) {
            let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
            const handle = document.getElementById("callDragHandle");
            handle.onmousedown = (e) => { p3 = e.clientX; p4 = e.clientY; document.onmouseup = () => {document.onmousemove = null;}; document.onmousemove = (e) => { p1 = p3 - e.clientX; p2 = p4 - e.clientY; p3 = e.clientX; p4 = e.clientY; elmnt.style.top = (elmnt.offsetTop - p2) + "px"; elmnt.style.left = (elmnt.offsetLeft - p1) + "px"; elmnt.style.bottom = "auto"; elmnt.style.right = "auto"; }; };
            handle.ontouchstart = (e) => { p3 = e.touches[0].clientX; p4 = e.touches[0].clientY; document.ontouchend = () => {document.ontouchmove = null;}; document.ontouchmove = (e) => { p1 = p3 - e.touches[0].clientX; p2 = p4 - e.touches[0].clientY; p3 = e.touches[0].clientX; p4 = e.touches[0].clientY; elmnt.style.top = (elmnt.offsetTop - p2) + "px"; elmnt.style.left = (elmnt.offsetLeft - p1) + "px"; elmnt.style.bottom = "auto"; elmnt.style.right = "auto"; }; };
        }
    </script>
</body>
</html>
