<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Space</title>
    <style>
        :root {
            --bg-color: #f7f7f7;
            --user-bubble: #f6a4b4;
            --char-bubble: #ffffff;
            --text-main: #333333;
            --text-sub: #999999;
        }

        body { margin: 0; padding: 0; background-color: var(--bg-color); font-family: -apple-system, sans-serif; display: flex; justify-content: center; }

        .phone-container {
            width: 100%; max-width: 500px; height: 100vh;
            display: flex; flex-direction: column; background: #fffafa; position: relative;
        }

        /* 截圖風格頂部欄 */
        .top-status-bar {
            background: #fff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee;
        }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-sub); }
        .avatar-tiny { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid #eee; }

        /* 撥號區（仿截圖中間的膠囊形狀） */
        .call-trigger-pill {
            background: #1a1a1a; color: white; padding: 6px 15px; border-radius: 20px;
            display: flex; align-items: center; gap: 10px; font-size: 0.8rem; cursor: pointer;
        }

        /* 浮動通話 UI (你原本的功能) */
        #callUI {
            display: none; position: fixed; top: 100px; right: 20px; width: 130px;
            background: rgba(40, 40, 40, 0.95); color: white; border-radius: 15px; z-index: 9999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); backdrop-filter: blur(5px);
        }
        .call-drag-handle { padding: 8px; cursor: move; background: rgba(255,255,255,0.1); border-radius: 15px 15px 0 0; font-size: 0.65rem; text-align: center; }

        /* 字卡區 */
        .card-manager { padding: 10px; background: #fff; border-bottom: 1px solid #eee; max-height: 100px; overflow-y: auto; }
        .word-tag { display: inline-flex; align-items: center; background: #fff0f3; border: 1px solid #ffb6c1; padding: 3px 8px; margin: 2px; border-radius: 12px; font-size: 0.7rem; color: #ff8fa3; }
        .del-card { margin-left: 4px; cursor: pointer; color: #ff4d6d; border: none; background: none; }

        /* 聊天區域 */
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 18px; }
        .chat-area::-webkit-scrollbar { display: none; }
        .msg-group { display: flex; gap: 10px; max-width: 85%; animation: fadeIn 0.3s ease; }
        .msg-group.me { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .msg-bubble { padding: 10px 14px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .me .msg-bubble { background: var(--user-bubble); color: white; border-top-right-radius: 4px; }
        .char .msg-bubble { background: var(--char-bubble); color: var(--text-main); border-top-left-radius: 4px; border: 1px solid #eee; }
        .time-stamp { font-size: 0.65rem; color: var(--text-sub); margin-top: 4px; }

        /* 輸入欄 */
        .bottom-bar { padding: 10px 15px 25px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .input-box { flex: 1; background: #f0f0f0; border: none; padding: 10px 18px; border-radius: 20px; outline: none; }
        .send-btn { background: #ffb6c1; color: white; border: none; padding: 0 15px; border-radius: 20px; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="top-status-bar">
        <div class="user-info"><img src="https://i.imgur.com/G4h1mYl.png" class="avatar-tiny"> 菊丸...</div>
        <div class="call-trigger-pill" onclick="startCall()">
            <img src="https://i.imgur.com/G4h1mYl.png" class="avatar-tiny" style="width:20px; height:20px;">
            <span>點擊撥打</span>
            <span style="color:#ff4d4d;">📞</span>
        </div>
        <div class="user-info">日向... <img src="https://i.imgur.com/yvX39u4.png" class="avatar-tiny"></div>
    </div>

    <div class="card-manager">
        <div id="cardsContainer"></div>
        <div style="margin-top: 5px; display: flex; gap: 5px;">
            <input type="text" id="newCardInput" placeholder="新增回覆..." style="flex:1; font-size: 0.7rem;">
            <button onclick="saveNewCard()" style="font-size: 0.7rem;">新增</button>
        </div>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="bottom-bar">
        <input type="text" id="userInput" class="input-box" placeholder="輸入訊息...">
        <button onclick="handleUserSend()" class="send-btn">發送</button>
    </div>
</div>

<!-- 浮動通話面板 (保留你要求的功能) -->
<div id="callUI">
    <div class="call-drag-handle" id="callDragHandle">⋮⋮ 拖曳通話</div>
    <div style="padding:12px; text-align:center;">
        <div style="font-size:0.7rem; opacity:0.8;">菊丸 英二</div>
        <div id="timer" style="font-family:monospace; font-size:1.1rem; margin:5px 0;">00:00</div>
        <button onclick="hangUp()" style="background:#ff4d4d; color:white; border:none; border-radius:8px; font-size:0.7rem; padding:4px 10px; cursor:pointer;">掛斷</button>
    </div>
</div>

<script>
    const STORAGE_KEY_MSGS = 'eiji_chat_history_v2';
    const STORAGE_KEY_CARDS = 'eiji_word_cards_v2';
    const USER_AVATAR = "https://i.imgur.com/yvX39u4.png";
    const CHAR_AVATAR = "https://i.imgur.com/G4h1mYl.png";

    let wordCards = JSON.parse(localStorage.getItem(STORAGE_KEY_CARDS)) || ["今天也要加油喔！", "不准太累！", "想我了嗎？", "🎾 嘿嘿！"];
    let chatHistory = JSON.parse(localStorage.getItem(STORAGE_KEY_MSGS)) || [];

    window.onload = () => {
        renderCards();
        renderChat();
        makeDraggable(document.getElementById("callUI"));
        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleUserSend(); });
    };

    // 通話功能
    let callInterval, sec = 0;
    function startCall() {
        document.getElementById('callUI').style.display = 'block';
        sec = 0; clearInterval(callInterval);
        callInterval = setInterval(() => {
            sec++;
            let m = Math.floor(sec/60).toString().padStart(2, '0');
            let s = (sec%60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);
    }
    function hangUp() { document.getElementById('callUI').style.display = 'none'; clearInterval(callInterval); }

    // 拖曳功能
    function makeDraggable(el) {
        let p1=0, p2=0, p3=0, p4=0;
        const handle = document.getElementById("callDragHandle");
        handle.onmousedown = dragMouseDown;
        handle.ontouchstart = (e) => dragMouseDown(e.touches[0]);
        function dragMouseDown(e) { p3=e.clientX; p4=e.clientY; document.onmouseup=closeDrag; document.onmousemove=elementDrag; document.ontouchend=closeDrag; document.ontouchmove=(e)=>elementDrag(e.touches[0]); }
        function elementDrag(e) { p1=p3-e.clientX; p2=p4-e.clientY; p3=e.clientX; p4=e.clientY; el.style.top=(el.offsetTop-p2)+"px"; el.style.left=(el.offsetLeft-p1)+"px"; }
        function closeDrag() { document.onmouseup=null; document.onmousemove=null; }
    }

    // 聊天與存檔
    function renderCards() {
        document.getElementById('cardsContainer').innerHTML = wordCards.map((t, i) => `<div class="word-tag">${t}<button class="del-card" onclick="deleteCard(${i})">✕</button></div>`).join('');
        localStorage.setItem(STORAGE_KEY_CARDS, JSON.stringify(wordCards));
    }
    function saveNewCard() { const v = document.getElementById('newCardInput').value.trim(); if(v){wordCards.push(v); document.getElementById('newCardInput').value=''; renderCards();} }
    function deleteCard(i) { wordCards.splice(i, 1); renderCards(); }

    function handleUserSend() {
        const input = document.getElementById('userInput');
        if(!input.value.trim()) return;
        addMsg('me', '日向 鈴音', input.value);
        input.value = '';
        setTimeout(() => { if(wordCards.length > 0) addMsg('char', '菊丸 英二', wordCards[Math.floor(Math.random()*wordCards.length)]); }, 1000);
    }

    function addMsg(s, n, t) {
        chatHistory.push({ s, n, t, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        localStorage.setItem(STORAGE_KEY_MSGS, JSON.stringify(chatHistory));
        renderChat();
    }

    function renderChat() {
        const area = document.getElementById('chatArea');
        area.innerHTML = chatHistory.map(m => `
            <div class="msg-group ${m.s}">
                <img src="${m.s==='me'?USER_AVATAR:CHAR_AVATAR}" class="avatar">
                <div class="msg-content">
                    <div class="msg-bubble">${m.t}</div>
                    <div class="time-stamp">${m.time}</div>
                </div>
            </div>
        `).join('');
        area.scrollTop = area.scrollHeight;
    }
</script>
</body>
</html>
