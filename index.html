<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Our Space</title>
    <style>
        :root { 
            --main-pink: #f6a4b4; 
            --bg-gray: #f7f7f7; 
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            margin: 0; 
            background: var(--bg-gray); 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            overflow: hidden; 
        }

        /* 使用 dvh 讓容器完美契合手機動態高度，防止底部被遮擋 */
        .app-container { 
            width: 100%; 
            max-width: 500px; 
            height: 100vh; 
            height: 100dvh; 
            background: #fffafa; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
        }

        /* 頂部功能列 */
        .top-nav { 
            background: #fff; 
            padding: 12px 15px; 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid #eee; 
            z-index: 100; 
        }
        .icon-btn { cursor: pointer; font-size: 1.4rem; transition: 0.2s; user-select: none; }
        .icon-btn:hover { opacity: 0.6; }

        /* 隱藏式彈出面板 */
        .drawer { 
            position: absolute; 
            top: 53px; 
            left: 0; 
            width: 100%; 
            background: white; 
            border-bottom: 2px solid var(--main-pink); 
            display: none; 
            z-index: 90; 
            padding: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            max-height: 50vh; 
            overflow-y: auto; 
        }
        .drawer.active { display: block; }

        /* 聊天顯示區 */
        .chat-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        .chat-area::-webkit-scrollbar { display: none; }

        .msg-group { display: flex; gap: 10px; max-width: 85%; position: relative; }
        .msg-group.me { align-self: flex-end; flex-direction: row-reverse; }
        .avatar-box { text-align: center; cursor: pointer; min-width: 50px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .name-label { font-size: 0.65rem; color: #999; margin-top: 2px; }
        
        .msg-bubble { padding: 10px 14px; border-radius: 18px; font-size: 0.95rem; position: relative; cursor: pointer; line-height: 1.4; }
        .me .msg-bubble { background: var(--main-pink); color: white; border-top-right-radius: 4px; }
        .char .msg-bubble { background: #fff; border: 1px solid #eee; border-top-left-radius: 4px; color: #333; }
        
        .reply-quote { font-size: 0.75rem; background: rgba(0,0,0,0.06); padding: 5px 8px; border-left: 3px solid var(--main-pink); margin-bottom: 5px; border-radius: 4px; color: #666; }
        .reply-btn { position: absolute; top: 5px; right: -35px; display: none; cursor: pointer; font-size: 1.2rem; background: #fff; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 25px; height: 25px; text-align: center; line-height: 25px; }
        .me .reply-btn { left: -35px; right: auto; }

        /* 表情包 */
        .sticker-img { max-width: 140px; border-radius: 10px; display: block; margin-top: 5px; border: 1px solid #eee; }
        .sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .sticker-item { position: relative; border: 1px solid #eee; border-radius: 5px; overflow: hidden; }
        .del-sticker { position: absolute; top: 0; right: 0; background: rgba(255,0,0,0.7); color: white; border: none; font-size: 10px; cursor: pointer; padding: 2px 5px; }

        /* 關鍵修正：底部欄位往上提，增加底部安全安全距離，避免被虛擬鍵擋住 */
        .bottom-bar { 
            padding: 12px 15px calc(15px + env(safe-area-inset-bottom)); 
            background: #fff; 
            border-top: 1px solid #eee; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .input-box { flex: 1; background: #f3f3f3; border: none; padding: 12px 15px; border-radius: 20px; outline: none; font-size: 1rem; }
        
        #callUI { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: white; padding: 10px 25px; border-radius: 25px; display: none; z-index: 1000; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-nav">
        <span class="icon-btn" onclick="toggleDrawer('calendar')">📅</span>
        <span class="icon-btn" onclick="toggleDrawer('cards')">🗂️</span>
        <span class="icon-btn" onclick="toggleDrawer('stickers')">😊</span>
        <span class="icon-btn" onclick="exportData()" title="導出資料">💾</span>
        <span class="icon-btn" onclick="toggleDrawer('settings')">⚙️</span>
    </div>

    <div id="calendar" class="drawer">今日日期：<span id="dateStr"></span></div>
    <div id="cards" class="drawer">
        <h4 style="margin:0 0 10px 0;">字卡庫</h4>
        <div id="cardList" style="margin-bottom:10px;"></div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="newCard" placeholder="輸入回覆..." style="flex:1;">
            <button onclick="addCard()">新增</button>
        </div>
    </div>
    <div id="stickers" class="drawer">
        <h4 style="margin:0 0 10px 0;">表情包 (點擊發送)</h4>
        <input type="file" accept="image/*" onchange="uploadSticker(this)">
        <div class="sticker-grid" id="stickerGrid"></div>
    </div>
    <div id="settings" class="drawer">
        <h4>設定</h4>
        使用者名字：<input type="text" id="userNameInput" onchange="saveProfile()"><br><br>
        大寶名字：<input type="text" id="charNameInput" onchange="saveProfile()"><br><br>
        <button onclick="importData()" style="background:#eee; border:1px solid #ccc; padding:5px 10px;">匯入備份檔 (.json)</button>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div id="quotePreview" style="display:none; padding:8px 15px; background:#f0f0f0; font-size:0.8rem; border-left: 4px solid var(--main-pink);">
        引用中... <span onclick="clearQuote()" style="float:right; cursor:pointer;">✕</span>
    </div>

    <div class="bottom-bar">
        <span class="icon-btn" onclick="toggleCall()">📞</span>
        <input type="text" id="userInput" class="input-box" placeholder="說點什麼...">
        <button class="icon-btn" style="border:none; background:none; font-size:1.4rem;" onclick="handleSend()">🚀</button>
    </div>
</div>

<div id="callUI">
    <div style="font-size:0.7rem; opacity:0.7;">通話中</div>
    <div id="callTimer">00:00</div>
    <button onclick="toggleCall()" style="background:#ff4d4d; color:white; border:none; border-radius:5px; padding:2px 8px; margin-top:5px; font-size:0.7rem;">掛斷</button>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('dream_data_v3')) || {
        chat: [],
        cards: ["今天也要加油喔！", "🎾 嘿嘿，贏了！", "想我了嗎？"],
        stickers: [],
        profiles: { 
            me: { n: "日向 鈴音", a: "https://i.imgur.com/yvX39u4.png" }, 
            char: { n: "菊丸 英二", a: "https://i.imgur.com/G4h1mYl.png" } 
        }
    };

    let activeQuote = null;
    let callInterval, sec = 0;

    window.onload = () => {
        document.getElementById('dateStr').innerText = new Date().toLocaleDateString();
        document.getElementById('userNameInput').value = state.profiles.me.n;
        document.getElementById('charNameInput').value = state.profiles.char.n;
        renderAll();
        // 綁定 Enter 鍵發送
        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSend(); });
    };

    function save() { localStorage.setItem('dream_data_v3', JSON.stringify(state)); }

    function exportData() {
        const dataStr = JSON.stringify(state);
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        const linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', `DreamChat_Backup_${new Date().getTime()}.json`);
        linkElement.click();
    }

    function importData() {
        const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
        input.onchange = e => {
            const reader = new FileReader();
            reader.readAsText(e.target.files[0],'UTF-8');
            reader.onload = re => { state = JSON.parse(re.target.result); save(); location.reload(); }
        }
        input.click();
    }

    function toggleDrawer(id) {
        document.querySelectorAll('.drawer').forEach(d => { if(d.id !== id) d.classList.remove('active'); });
        document.getElementById(id).classList.toggle('active');
    }

    function renderAll() { renderChat(); renderCards(); renderStickers(); }

    function handleSend() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;
        
        state.chat.push({ s: 'me', t: text, q: activeQuote, time: curTime() });
        input.value = '';
        clearQuote();
        save();
        renderChat();

        setTimeout(() => {
            const isSticker = Math.random() > 0.8 && state.stickers.length > 0;
            state.chat.push({ 
                s: 'char', 
                t: isSticker ? "" : state.cards[Math.floor(Math.random()*state.cards.length)],
                img: isSticker ? state.stickers[Math.floor(Math.random()*state.stickers.length)] : null,
                time: curTime() 
            });
            save(); renderChat();
        }, 1000);
    }

    function renderChat() {
        const area = document.getElementById('chatArea');
        area.innerHTML = state.chat.map((m, i) => `
            <div class="msg-group ${m.s}">
                <div class="avatar-box" onclick="changeAvatar('${m.s}')">
                    <img src="${state.profiles[m.s].a}" class="avatar">
                    <div class="name-label">${state.profiles[m.s].n}</div>
                </div>
                <div class="msg-content">
                    <div class="msg-bubble" onclick="showReplyBtn(${i})">
                        ${m.q ? `<div class="reply-quote">${m.q}</div>` : ''}
                        ${m.t}
                        ${m.img ? `<img src="${m.img}" class="sticker-img">` : ''}
                        <div class="reply-btn" id="rb-${i}" onclick="quoteMsg('${m.t || '圖片訊息'}')">💬</div>
                    </div>
                    <div style="font-size:0.55rem; color:#ccc; margin-top:3px;">${m.time}</div>
                </div>
            </div>
        `).join('');
        area.scrollTop = area.scrollHeight;
    }

    function showReplyBtn(i) {
        document.querySelectorAll('.reply-btn').forEach(b => b.style.display = 'none');
        document.getElementById(`rb-${i}`).style.display = 'block';
    }
    
    function quoteMsg(text) {
        activeQuote = text.substring(0, 20) + (text.length > 20 ? "..." : "");
        document.getElementById('quotePreview').style.display = 'block';
        document.getElementById('quotePreview').innerHTML = `引用：${activeQuote} <span onclick="clearQuote()" style="float:right;">✕</span>`;
    }
    
    function clearQuote() { activeQuote = null; document.getElementById('quotePreview').style.display = 'none'; }

    function uploadSticker(input) {
        const file = input.files[0];
        if(file.size > 500000) return alert("圖片大於 500KB 囉！");
        const reader = new FileReader();
        reader.onload = (e) => { state.stickers.push(e.target.result); save(); renderStickers(); };
        reader.readAsDataURL(file);
    }
    
    function renderStickers() {
        document.getElementById('stickerGrid').innerHTML = state.stickers.map((s, i) => `
            <div class="sticker-item">
                <img src="${s}" style="width:100%; height:80px; object-fit:cover;" onclick="sendSticker('${s}')">
                <button class="del-sticker" onclick="event.stopPropagation();state.stickers.splice(${i},1);save();renderStickers();">✕</button>
            </div>
        `).join('');
    }
    
    function sendSticker(url) {
        state.chat.push({ s: 'me', t: '', img: url, time: curTime() });
        save(); renderChat(); toggleDrawer('stickers');
    }

    function toggleCall() {
        const ui = document.getElementById('callUI');
        if(ui.style.display === 'block') {
            ui.style.display = 'none'; clearInterval(callInterval);
        } else {
            ui.style.display = 'block'; sec = 0;
            callInterval = setInterval(() => {
                sec++;
                document.getElementById('callTimer').innerText = Math.floor(sec/60).toString().padStart(2,'0') + ":" + (sec%60).toString().padStart(2,'0');
            }, 1000);
        }
    }
    
    function saveProfile() {
        state.profiles.me.n = document.getElementById('userNameInput').value;
        state.profiles.char.n = document.getElementById('charNameInput').value;
        save(); renderChat();
    }
    
    function changeAvatar(role) {
        const url = prompt("請貼上新的圖片網址：", state.profiles[role].a);
        if(url) { state.profiles[role].a = url; save(); renderChat(); }
    }
    
    function addCard() {
        const v = document.getElementById('newCard').value;
        if(v) { state.cards.push(v); document.getElementById('newCard').value=''; save(); renderCards(); }
    }
    
    function renderCards() {
        document.getElementById('cardList').innerHTML = state.cards.map((c,i) => `
            <div style="font-size:0.8rem; margin:5px 0; border-bottom:1px solid #f9f9f9;">
                ${c} <span style="color:red; cursor:pointer; float:right;" onclick="state.cards.splice(${i},1);save();renderCards()">✕</span>
            </div>`).join('');
    }
    
    function curTime() { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
</script>
</body>
</html>
