<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Space</title>
    <style>
        :root {
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --primary: #ffb6c1;
            --primary-dark: #ff8fa3;
            --text-color: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            touch-action: pan-y; /* 允許垂直網頁滾動 */
        }

        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 20px);
        }

        .calendar-header {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .status-section {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ffe4e8;
            flex-shrink: 0;
        }

        .mood-badge {
            display: inline-block;
            background: #ffe4e8;
            color: #ff4d6d;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #randomTalk {
            font-style: italic;
            color: #777;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .word-cards-container {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            background: #fffafb;
        }
        .word-cards-container::-webkit-scrollbar { display: none; }

        /* 修改字卡樣式：點擊即可發送 */
        .word-card {
            background: white;
            border-left: 5px solid var(--primary);
            padding: 12px 40px 12px 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            position: relative;
            font-size: 0.95rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            cursor: pointer;
            transition: background 0.2s;
        }
        .word-card:active {
            background: #fff5f6;
        }

        .delete-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #bbb;
            border: none;
            background: none;
            font-size: 1.2rem;
            padding: 8px;
            z-index: 10;
        }

        .add-word-area {
            display: flex;
            padding: 10px;
            gap: 8px;
            background: white;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 10px 15px;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-section {
            padding: 10px;
            background: #fff;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }

        .chat-display {
            height: 120px;
            overflow-y: auto;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .chat-display::-webkit-scrollbar { display: none; }

        .msg { margin-bottom: 6px; font-size: 0.9rem; padding: 6px 10px; border-radius: 8px; line-height: 1.4; word-break: break-all; }
        .msg.my-msg { background: #fff0f2; border: 1px dashed var(--primary); cursor: pointer; }

        .sticker-box {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 5px;
        }
        .sticker-box::-webkit-scrollbar { display: none; }
        .sticker { font-size: 2.2rem; cursor: pointer; }

        /* --- 可拖曳電話懸浮窗 --- */
        #callUI {
            display: none;
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 150px;
            background: rgba(51, 51, 51, 0.95);
            color: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 9999;
            backdrop-filter: blur(5px);
            /* 防止拖曳時選取到裡面的文字 */
            user-select: none;
            -webkit-user-select: none;
        }

        /* 縮小成圓球 */
        #callUI.mini {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        /* 增加拖曳手把區 */
        .call-drag-handle {
            padding: 8px 10px 0;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drag-dots { color: #888; font-size: 0.8rem; }

        .call-body { padding: 0 12px 12px 12px; text-align: center; }
        .call-body.hidden { display: none; }
        
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: #eee; margin: 5px auto; border: 2px solid var(--primary); }
        .timer { font-family: monospace; font-size: 1.1rem; margin: 5px 0; color: #fff; }

        .btn { border: none; border-radius: 20px; padding: 10px 20px; cursor: pointer; font-size: 0.95rem; font-weight: bold; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: #ff4d4d; color: white; padding: 6px 12px; font-size: 0.8rem; border-radius: 15px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="calendar-header" id="dateDisplay">2026.05.26</div>
        
        <div class="status-section">
            <div class="mood-badge" id="currentMood">☀️ 充滿活力</div>
            <div id="randomTalk">「正在想你要說什麼...」</div>
            <button class="btn btn-primary" style="margin-top:10px; width: 100%;" onclick="tryCall()">撥打電話給大寶 📞</button>
        </div>

        <div class="word-cards-container" id="cardsList"></div>

        <div class="add-word-area">
            <input type="text" id="wordInput" placeholder="新增今日字卡...">
            <button class="btn btn-primary" style="padding: 10px 15px;" onclick="addCard()">+</button>
        </div>

        <div class="chat-section">
            <div id="replyPreview" style="display:none; font-size: 0.8rem; background: #eee; padding: 6px; margin-bottom: 5px; border-radius: 5px;">
                引用中... <span onclick="cancelReply()" style="float:right; color:red; font-weight:bold; padding:0 5px;">✕</span>
            </div>
            <div class="chat-display" id="chatDisplay"></div>
            <div class="sticker-box">
                <span class="sticker" onclick="sendSticker('😊')">😊</span>
                <span class="sticker" onclick="sendSticker('🐱')">🐱</span>
                <span class="sticker" onclick="sendSticker('💖')">💖</span>
                <span class="sticker" onclick="sendSticker('🎾')">🎾</span>
                <span class="sticker" onclick="sendSticker('💤')">💤</span>
            </div>
        </div>
    </div>

    <div id="callUI">
        <div class="call-drag-handle" id="callDragHandle">
            <span class="drag-dots">⋮⋮ 拖曳</span>
            <span id="miniToggleBtn" onclick="toggleMini(event)" style="cursor:pointer; font-size: 1.3rem; color: var(--primary); font-weight:bold; padding: 0 5px;">−</span>
        </div>
        <div class="call-body" id="callBody">
            <div class="avatar"></div>
            <div style="font-size:0.85rem; font-weight:bold;">大寶</div>
            <div class="timer" id="timer">00:00</div>
            <button class="btn btn-danger" onclick="hangUp()">掛斷</button>
        </div>
    </div>

    <script>
        const moods = ["☀️ 充滿活力", "☁️ 有點睏倦", "🐱 玩球中", "🎾 比賽完很累", "💖 想見你"];
        const initWords = ["今天也要加油喔！", "記得想我～", "專題辛苦了！", "等一下要吃什麼？"];
        let selectedReply = null;

        window.onload = () => {
            const now = new Date();
            document.getElementById('dateDisplay').innerText = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()}`;
            document.getElementById('currentMood').innerText = moods[Math.floor(Math.random() * moods.length)];
            document.getElementById('randomTalk').innerText = `「${initWords[Math.floor(Math.random() * initWords.length)]}」`;
            
            createCardElement("今天也要開開心心！");
            createCardElement("打球記得多喝水 🥤");
            makeElementDraggable(document.getElementById("callUI"));
        };

        // 字卡增刪
        function addCard() {
            const input = document.getElementById('wordInput');
            if (input.value.trim()) {
                createCardElement(input.value);
                input.value = '';
            }
        }

        function createCardElement(text) {
            const container = document.getElementById('cardsList');
            const div = document.createElement('div');
            div.className = 'word-card';
            // 點擊卡片本體傳送到聊天室，點擊X才是刪除
            div.setAttribute('onclick', 'sendCardToChat(this, event)');
            div.innerHTML = `<span class="card-text">${text}</span><button class="delete-btn" onclick="deleteCard(this, event)">✕</button>`;
            container.prepend(div);
        }

        function deleteCard(btn, event) {
            event.stopPropagation(); // 阻止觸發發送對話
            btn.parentElement.remove();
        }

        // 功能 1：把字卡內容當作對話發送
        function sendCardToChat(cardEl, event) {
            const text = cardEl.querySelector('.card-text').innerText;
            appendMessage(text);
        }

        // 發送表情包
        function sendSticker(emoji) {
            appendMessage(emoji);
        }

        // 整合發送訊息與引用邏輯
        function appendMessage(content) {
            const display = document.getElementById('chatDisplay');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg my-msg';
            
            let finalContent = content;
            if (selectedReply) {
                finalContent = `<small style="color:#888; display:block; border-bottom:1px dashed #ccc; margin-bottom:3px; padding-bottom:2px;">引用：${selectedReply}</small>${content}`;
                cancelReply();
            }
            
            msgDiv.innerHTML = `<strong>我:</strong> ${finalContent}`;
            // 點擊訊息可以再度引用它
            msgDiv.onclick = () => prepareReply(content);
            display.appendChild(msgDiv);
            display.scrollTop = display.scrollHeight;
        }

        function prepareReply(text) {
            selectedReply = text;
            const preview = document.getElementById('replyPreview');
            preview.style.display = 'block';
            preview.innerHTML = `引用中：${text} <span onclick="cancelReply()" style="float:right; color:red; font-weight:bold; padding:0 5px;">✕</span>`;
        }

        function cancelReply() {
            selectedReply = null;
            document.getElementById('replyPreview').style.display = 'none';
        }

        // 電話系統
        let timerInt;
        let sec = 0;
        let isMini = false;

        function tryCall() {
            const chance = Math.random();
            if (chance > 0.6) {
                alert("對方忙碌中，或者正在練習網球喔...🎾");
            } else {
                startCall();
            }
        }

        function startCall() {
            document.getElementById('callUI').style.display = 'block';
            sec = 0;
            clearInterval(timerInt);
            timerInt = setInterval(() => {
                sec++;
                let m = Math.floor(sec/60).toString().padStart(2, '0');
                let s = (sec%60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function hangUp() {
            document.getElementById('callUI').style.display = 'none';
            clearInterval(timerInt);
            if(isMini) toggleMini(null);
        }

        function toggleMini(event) {
            if(event) event.stopPropagation();
            const ui = document.getElementById('callUI');
            const body = document.getElementById('callBody');
            const btn = document.getElementById('miniToggleBtn');
            const handle = document.getElementById('callDragHandle');
            
            isMini = !isMini;
            ui.classList.toggle('mini', isMini);
            body.classList.toggle('hidden', isMini);
            
            if (isMini) {
                btn.innerText = "＋";
                handle.style.padding = "18px 0 0 0";
                handle.style.justifyContent = "center";
                document.querySelector('.drag-dots').style.display = 'none';
            } else {
                btn.innerText = "−";
                handle.style.padding = "8px 10px 0";
                handle.style.justifyContent = "space-between";
                document.querySelector('.drag-dots').style.display = 'inline';
            }
        }

        // 功能 2：實現安卓手機觸控拖曳 (也支援電腦滑鼠)
        function makeElementDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const dragHandle = document.getElementById("callDragHandle");

            // 同時綁定滑鼠與觸控事件
            dragHandle.onmousedown = dragMouseDown;
            dragHandle.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function dragTouchStart(e) {
                // 不阻斷縮小按鈕的點擊
                if(e.target.id === "miniToggleBtn") return;
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementTouchDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                updatePosition(pos1, pos2);
            }

            function elementTouchDrag(e) {
                pos1 = pos3 - e.touches[0].clientX;
                pos2 = pos4 - e.touches[0].clientY;
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                updatePosition(pos1, pos2);
            }

            function updatePosition(p1, p2) {
                // 限制不要拖出螢幕外
                let topPos = elmnt.offsetTop - p2;
                let leftPos = elmnt.offsetLeft - p1;
                
                if(topPos < 0) topPos = 0;
                if(topPos > window.innerHeight - elmnt.offsetHeight) topPos = window.innerHeight - elmnt.offsetHeight;
                if(leftPos < 0) leftPos = 0;
                if(leftPos > window.innerWidth - elmnt.offsetWidth) leftPos = window.innerWidth - elmnt.offsetWidth;

                elmnt.style.top = topPos + "px";
                elmnt.style.left = leftPos + "px";
                elmnt.style.bottom = "auto";
                elmnt.style.right = "auto";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }
    </script>
</body>
</html>
